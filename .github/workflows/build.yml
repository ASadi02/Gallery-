          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val repo = MediaRepository(this)
                  val gpsFromIntent = intent?.getBooleanExtra("show_gps_metadata", repo.isGpsMetadataEnabled())
                      ?: repo.isGpsMetadataEnabled()
                  repo.setGpsMetadataEnabled(gpsFromIntent)

                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = Color(0xFF0A0B0D),
                              surface = Color(0xFF121418),
                              primary = Color(0xFFE5A93C),
                              onBackground = Color(0xFFF3F4F6),
                              onSurface = Color(0xFFF3F4F6)
                          )
                      ) {
                          GalleryProApp(repo = repo)
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun GalleryProApp(repo: MediaRepository) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var items by remember { mutableStateOf<List<MediaItem>>(emptyList()) }
              var selectedIndex by remember { mutableStateOf<Int?>(null) }
              var editingItem by remember { mutableStateOf<MediaItem?>(null) }
              var showGpsSetting by remember { mutableStateOf(repo.isGpsMetadataEnabled()) }

              val permissions = remember {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      arrayOf(Manifest.permission.READ_MEDIA_IMAGES)
                  } else {
                      arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
              }

              var hasMediaPermission by remember {
                  mutableStateOf(
                      permissions.all {
                          ContextCompat.checkSelfPermission(context, it) == PackageManager.PERMISSION_GRANTED
                      }
                  )
              }

              val permLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { res ->
                  hasMediaPermission = res.values.all { it }
                  if (hasMediaPermission) {
                      scope.launch { items = repo.loadRecentImages() }
                  }
              }

              LaunchedEffect(hasMediaPermission) {
                  if (hasMediaPermission) {
                      items = repo.loadRecentImages()
                  } else {
                      permLauncher.launch(permissions)
                  }
              }

              Scaffold(
                  containerColor = Color(0xFF0A0B0D)
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                  ) {
                      when {
                          editingItem != null -> {
                              ProColorEditorScreen(
                                  item = editingItem!!,
                                  repo = repo,
                                  onClose = { savedUri ->
                                      editingItem = null
                                      scope.launch {
                                          items = repo.loadRecentImages()
                                          if (savedUri != null) {
                                              val idx = items.indexOfFirst { it.uri == savedUri }
                                              if (idx >= 0) selectedIndex = idx
                                          }
                                      }
                                  }
                              )
                          }
                          selectedIndex != null && items.isNotEmpty() -> {
                              PhotoPagerViewerScreen(
                                  items = items,
                                  initialIndex = selectedIndex!!.coerceIn(0, items.lastIndex),
                                  showGpsMetadata = showGpsSetting,
                                  repo = repo,
                                  onBackToGrid = { selectedIndex = null },
                                  onEditPhoto = { target -> editingItem = target },
                                  onItemsChanged = { updated -> items = updated }
                              )
                          }
                          else -> {
                              MinimalGalleryGridScreen(
                                  items = items,
                                  showGpsSetting = showGpsSetting,
                                  onToggleGpsSetting = { enabled ->
                                      showGpsSetting = enabled
                                      repo.setGpsMetadataEnabled(enabled)
                                  },
                                  onRefresh = {
                                      scope.launch { items = repo.loadRecentImages() }
                                  },
                                  onOpenPhoto = { idx -> selectedIndex = idx }
                              )
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun MinimalGalleryGridScreen(
              items: List<MediaItem>,
              showGpsSetting: Boolean,
              onToggleGpsSetting: (Boolean) -> Unit,
              onRefresh: () -> Unit,
              onOpenPhoto: (Int) -> Unit
          ) {
              var onlyFavorites by remember { mutableStateOf(false) }
              var showSettingsDialog by remember { mutableStateOf(false) }
              val visibleItems = remember(items, onlyFavorites) {
                  if (onlyFavorites) items.filter { it.isFavorite } else items
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  TopAppBar(
                      title = {
                          Text(
                              text = if (onlyFavorites) "Favoriler" else "Galeri",
                              fontWeight = FontWeight.SemiBold,
                              fontSize = 20.sp
                          )
                      },
                      actions = {
                          IconButton(onClick = { onlyFavorites = !onlyFavorites }) {
                              Icon(
                                  imageVector = if (onlyFavorites) Icons.Filled.Favorite else Icons.Outlined.FavoriteBorder,
                                  contentDescription = "Favoriler",
                                  tint = if (onlyFavorites) Color(0xFFE5A93C) else Color(0xFFF3F4F6)
                              )
                          }
                          IconButton(onClick = onRefresh) {
                              Icon(Icons.Filled.Refresh, contentDescription = "Yenile")
                          }
                          IconButton(onClick = { showSettingsDialog = true }) {
                              Icon(Icons.Outlined.Tune, contentDescription = "Ayarlar")
                          }
                      },
                      colors = TopAppBarDefaults.topAppBarColors(
                          containerColor = Color(0xFF0A0B0D),
                          titleContentColor = Color(0xFFF3F4F6)
                      )
                  )

                  if (visibleItems.isEmpty()) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Gösterilecek fotoğraf bulunamadı", color = Color(0xFF9CA3AF))
                      }
                  } else {
                      LazyVerticalGrid(
                          columns = GridCells.Fixed(3),
                          horizontalArrangement = Arrangement.spacedBy(2.dp),
                          verticalArrangement = Arrangement.spacedBy(2.dp),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          itemsIndexed(visibleItems, key = { _, it -> it.uri.toString() }) { _, item ->
                              val realIndex = items.indexOfFirst { it.uri == item.uri }.coerceAtLeast(0)
                              Box(
                                  modifier = Modifier
                                      .aspectRatio(1f)
                                      .clickable { onOpenPhoto(realIndex) }
                              ) {
                                  AsyncImage(
                                      model = item.uri,
                                      contentDescription = item.displayName,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier.fillMaxSize()
                                  )
                                  if (item.isFavorite) {
                                      Icon(
                                          imageVector = Icons.Filled.Favorite,
                                          contentDescription = null,
                                          tint = Color(0xFFE5A93C),
                                          modifier = Modifier
                                              .align(Alignment.BottomEnd)
                                              .padding(6.dp)
                                              .size(16.dp)
                                      )
                                  }
                              }
                          }
                      }
                  }
              }

              if (showSettingsDialog) {
                  AlertDialog(
                      onDismissRequest = { showSettingsDialog = false },
                      title = { Text("Galeri & Meta Veri Ayarı") },
                      text = {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text("Konum (GPS) Bilgisini Göster", fontWeight = FontWeight.Medium)
                                  Text(
                                      "Yukarı kaydırılan detay panelinde koordinat görünsün",
                                      fontSize = 12.sp,
                                      color = Color(0xFF9CA3AF)
                                  )
                              }
                              Switch(checked = showGpsSetting, onCheckedChange = onToggleGpsSetting)
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { showSettingsDialog = false }) {
                              Text("Tamam")
                          }
                      }
                  )
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun PhotoPagerViewerScreen(
              items: List<MediaItem>,
              initialIndex: Int,
              showGpsMetadata: Boolean,
              repo: MediaRepository,
              onBackToGrid: () -> Unit,
              onEditPhoto: (MediaItem) -> Unit,
              onItemsChanged: (List<MediaItem>) -> Unit
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val pagerState = rememberPagerState(initialPage = initialIndex, pageCount = { items.size })
              val currentItem = items.getOrNull(pagerState.currentPage) ?: return

              var showMetaSheet by remember { mutableStateOf(false) }
              var metadata by remember { mutableStateOf<PhotoMetadata?>(null) }
              var chromeVisible by remember { mutableStateOf(true) }

              LaunchedEffect(currentItem.uri, showMetaSheet, showGpsMetadata) {
                  if (showMetaSheet) {
                      metadata = repo.readMetadata(currentItem, includeGps = showGpsMetadata)
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
                      .pointerInput(currentItem.uri) {
                          detectVerticalDragGestures { _, dragAmount ->
                              if (dragAmount < -35f) {
                                  showMetaSheet = true
                              } else if (dragAmount > 35f && showMetaSheet) {
                                  showMetaSheet = false
                              }
                          }
                      }
              ) {
                  HorizontalPager(
                      state = pagerState,
                      modifier = Modifier.fillMaxSize()
                  ) { page ->
                      val pageItem = items[page]
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .clickable { chromeVisible = !chromeVisible },
                          contentAlignment = Alignment.Center
                      ) {
                          AsyncImage(
                              model = pageItem.uri,
                              contentDescription = pageItem.displayName,
                              contentScale = ContentScale.Fit,
                              modifier = Modifier.fillMaxSize()
                          )
                      }
                  }

                  if (chromeVisible) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .align(Alignment.TopCenter)
                              .background(Color(0x88000000))
                              .padding(horizontal = 8.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          IconButton(onClick = onBackToGrid) {
                              Icon(Icons.Filled.ArrowBack, contentDescription = "Geri", tint = Color.White)
                          }
                          Text(
                              text = "${pagerState.currentPage + 1} / ${items.size}",
                              color = Color.White,
                              fontSize = 14.sp
                          )
                          IconButton(onClick = { showMetaSheet = true }) {
                              Icon(Icons.Outlined.Info, contentDescription = "Bilgi", tint = Color.White)
                          }
                      }

                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .align(Alignment.BottomCenter)
                              .background(Color(0xAA0A0B0D))
                              .padding(horizontal = 16.dp, vertical = 10.dp),
                          horizontalArrangement = Arrangement.SpaceAround,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = {
                              val nowFav = repo.toggleFavorite(currentItem.uri.toString())
                              val updated = items.map {
                                  if (it.uri == currentItem.uri) it.copy(isFavorite = nowFav) else it
                              }
                              onItemsChanged(updated)
                          }) {
                              Icon(
                                  imageVector = if (currentItem.isFavorite) Icons.Filled.Favorite else Icons.Outlined.FavoriteBorder,
                                  contentDescription = "Favori",
                                  tint = if (currentItem.isFavorite) Color(0xFFE5A93C) else Color.White
                              )
                          }

                          Button(
                              onClick = { onEditPhoto(currentItem) },
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = Color(0xFFE5A93C),
                                  contentColor = Color.Black
                              )
                          ) {
                              Icon(Icons.Filled.Tune, contentDescription = null, modifier = Modifier.size(18.dp))
                              Spacer(Modifier.width(6.dp))
                              Text("Düzenle", fontWeight = FontWeight.SemiBold)
                          }

                          IconButton(onClick = {
                              val shareUri = repo.prepareShareUri(currentItem.uri) ?: currentItem.uri
                              val sendIntent = Intent(Intent.ACTION_SEND).apply {
                                  type = "image/*"
                                  putExtra(Intent.EXTRA_STREAM, shareUri)
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }
                              context.startActivity(Intent.createChooser(sendIntent, "Paylaş"))
                          }) {
                              Icon(Icons.Filled.Share, contentDescription = "Paylaş", tint = Color.White)
                          }

                          IconButton(onClick = {
                              scope.launch {
                                  if (repo.deleteImage(currentItem)) {
                                      val nextList = items.filterNot { it.uri == currentItem.uri }
                                      onItemsChanged(nextList)
                                      if (nextList.isEmpty()) onBackToGrid()
                                  }
                              }
                          }) {
                              Icon(Icons.Outlined.Delete, contentDescription = "Sil", tint = Color(0xFFF87171))
                          }
                      }
                  }

                  if (showMetaSheet) {
                      ModalBottomSheet(
                          onDismissRequest = { showMetaSheet = false },
                          containerColor = Color(0xFF14171D),
                          contentColor = Color(0xFFF3F4F6)
                      ) {
                          val meta = metadata
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 20.dp, vertical = 8.dp)
                                  .padding(bottom = 24.dp),
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Text("Fotoğraf Detayları", fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                              HorizontalDivider(color = Color(0xFF262B35))
                              if (meta == null) {
                                  CircularProgressIndicator(modifier = Modifier.size(24.dp))
                              } else {
                                  MetaRow("Dosya", meta.fileName)
                                  MetaRow("Çözünürlük", meta.dimensions)
                                  MetaRow("Boyut", meta.fileSizeFormatted)
                                  MetaRow("Tarih", meta.dateTaken)
                                  MetaRow("Tür", meta.mimeType)
                                  meta.cameraModel?.let { MetaRow("Kamera", it) }
                                  meta.lensModel?.let { MetaRow("Lens", it) }
                                  val shotLine = listOfNotNull(meta.focalLength, meta.aperture, meta.shutterSpeed, meta.iso)
                                      .joinToString(" • ")
                                  if (shotLine.isNotBlank()) MetaRow("Çekim", shotLine)
                                  if (showGpsMetadata && meta.gpsSummary != null) {
                                      MetaRow("Konum", meta.gpsSummary)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun MetaRow(label: String, value: String) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Text(label, color = Color(0xFF9CA3AF), fontSize = 13.sp)
                  Text(value, color = Color(0xFFF3F4F6), fontSize = 13.sp, fontWeight = FontWeight.Medium)
              }
          }

          @Composable
          private fun ProColorEditorScreen(
              item: MediaItem,
              repo: MediaRepository,
              onClose: (android.net.Uri?) -> Unit
          ) {
              val scope = rememberCoroutineScope()
              var sourceBitmap by remember { mutableStateOf<Bitmap?>(null) }
              var params by remember { mutableStateOf(EditParams()) }
              var showOriginal by remember { mutableStateOf(false) }
              var showUnsavedDialog by remember { mutableStateOf(false) }
              var isSaving by remember { mutableStateOf(false) }

              var activeTab by remember { mutableStateOf(0) }
              var activeChannel by remember { mutableStateOf(CurveChannel.MASTER) }
              var activeWheel by remember { mutableStateOf(0) }
              var activeHslIndex by remember { mutableStateOf(0) }

              var glViewRef by remember { mutableStateOf<PhotoGlSurfaceView?>(null) }

              LaunchedEffect(item.uri) {
                  val bmp = repo.decodeBitmapForEdit(item.uri, maxDim = 2048)
                  sourceBitmap = bmp
                  glViewRef?.setBitmap(bmp)
              }

              LaunchedEffect(params, showOriginal, sourceBitmap) {
                  glViewRef?.updateParams(params, showOriginal)
              }

              fun requestExit() {
                  if (params.isModified()) showUnsavedDialog = true else onClose(null)
              }

              fun saveCopy() {
                  val src = sourceBitmap ?: return
                  if (isSaving) return
                  isSaving = true
                  scope.launch {
                      val rendered = renderBitmapOffscreen(src, params)
                      val savedUri = repo.saveEditedJpgCopy(item, rendered)
                      isSaving = false
                      onClose(savedUri)
                  }
              }

              BackHandler { requestExit() }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0A0B0D))
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 8.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      IconButton(onClick = { requestExit() }) {
                          Icon(Icons.Filled.Close, contentDescription = "Kapat", tint = Color.White)
                      }

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(
                              onClick = {},
                              modifier = Modifier.pointerInput(Unit) {
                                  detectTapGestures(
                                      onPress = {
                                          showOriginal = true
                                          tryAwaitRelease()
                                          showOriginal = false
                                      }
                                  )
                              }
                          ) {
                              Icon(
                                  imageVector = Icons.Outlined.Compare,
                                  contentDescription = "Orijinal Karşılaştır",
                                  tint = if (showOriginal) Color(0xFFE5A93C) else Color.White
                              )
                          }
                          IconButton(onClick = { params = EditParams() }) {
                              Icon(Icons.Filled.RestartAlt, contentDescription = "Sıfırla", tint = Color.White)
                          }
                          Button(
                              onClick = { saveCopy() },
                              enabled = !isSaving && sourceBitmap != null,
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = Color(0xFFE5A93C),
                                  contentColor = Color.Black
                              )
                          ) {
                              Text(if (isSaving) "Kaydediliyor..." else "Kaydet", fontWeight = FontWeight.SemiBold)
                          }
                      }
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1.15f)
                          .background(Color.Black),
                      contentAlignment = Alignment.Center
                  ) {
                      AndroidView(
                          factory = { ctx ->
                              PhotoGlSurfaceView(ctx).also { view ->
                                  glViewRef = view
                                  sourceBitmap?.let { view.setBitmap(it) }
                                  view.updateParams(params, showOriginal)
                              }
                          },
                          modifier = Modifier.fillMaxSize()
                      )
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                          .background(Color(0xFF12151C))
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 16.dp, vertical = 10.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      when (activeTab) {
                          0 -> {
                              ParamSlider("Pozlama", params.exposure, -3f..3f) { params = params.copy(exposure = it) }
                              ParamSlider("Kontrast", params.contrast, -1f..1f) { params = params.copy(contrast = it) }
                              ParamSlider("Aydınlıklar", params.highlights, -1f..1f) { params = params.copy(highlights = it) }
                              ParamSlider("Gölgeler", params.shadows, -1f..1f) { params = params.copy(shadows = it) }
                              ParamSlider("Beyazlar", params.whites, -1f..1f) { params = params.copy(whites = it) }
                              ParamSlider("Siyahlar", params.blacks, -1f..1f) { params = params.copy(blacks = it) }
                          }
                          1 -> {
                              ParamSlider("Sıcaklık (Temp)", params.temp, -1f..1f) { params = params.copy(temp = it) }
                              ParamSlider("Renk Tonu (Tint)", params.tint, -1f..1f) { params = params.copy(tint = it) }
                              ParamSlider("Canlılık (Vibrance)", params.vibrance, -1f..1f) { params = params.copy(vibrance = it) }
                              ParamSlider("Doygunluk", params.saturation, -1f..1f) { params = params.copy(saturation = it) }
                              HorizontalDivider(color = Color(0xFF252A34))
                              LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  items(params.hslBands.size) { idx ->
                                      val b = params.hslBands[idx]
                                      FilterChip(
                                          selected = activeHslIndex == idx,
                                          onClick = { activeHslIndex = idx },
                                          label = { Text(b.name, fontSize = 12.sp) }
                                      )
                                  }
                              }
                              val band = params.hslBands[activeHslIndex]
                              ParamSlider("${band.name} Ton", band.hue, -1f..1f) { v ->
                                  val list = params.hslBands.toMutableList().apply { this[activeHslIndex] = band.copy(hue = v) }
                                  params = params.copy(hslBands = list)
                              }
                              ParamSlider("${band.name} Doygunluk", band.saturation, -1f..1f) { v ->
                                  val list = params.hslBands.toMutableList().apply { this[activeHslIndex] = band.copy(saturation = v) }
                                  params = params.copy(hslBands = list)
                              }
                              ParamSlider("${band.name} Parlaklık", band.luminance, -1f..1f) { v ->
                                  val list = params.hslBands.toMutableList().apply { this[activeHslIndex] = band.copy(luminance = v) }
                                  params = params.copy(hslBands = list)
                              }
                          }
                          2 -> {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  CurveChannel.entries.forEach { ch ->
                                      FilterChip(
                                          selected = activeChannel == ch,
                                          onClick = { activeChannel = ch },
                                          label = { Text(ch.label, fontSize = 12.sp) }
                                      )
                                  }
                                  Spacer(Modifier.weight(1f))
                                  TextButton(onClick = {
                                      params = params.withCurve(activeChannel, listOf(CurvePoint(0f, 0f), CurvePoint(1f, 1f)))
                                  }) {
                                      Text("Kanalı Sıfırla", fontSize = 12.sp)
                                  }
                              }
                              ToneCurvePad(
                                  points = params.curveFor(activeChannel),
                                  onPointsChange = { updated -> params = params.withCurve(activeChannel, updated) }
                              )
                          }
                          3 -> {
                              val wheelNames = listOf("Gölgeler", "Orta Tonlar", "Aydınlıklar")
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  wheelNames.forEachIndexed { idx, title ->
                                      FilterChip(
                                          selected = activeWheel == idx,
                                          onClick = { activeWheel = idx },
                                          label = { Text(title, fontSize = 12.sp) }
                                      )
                                  }
                              }
                              val currentW = when (activeWheel) {
                                  0 -> params.shadowWheel
                                  1 -> params.midtoneWheel
                                  else -> params.highlightWheel
                              }
                              ColorWheelPad(
                                  wheel = currentW,
                                  onWheelChange = { updated ->
                                      params = when (activeWheel) {
                                          0 -> params.copy(shadowWheel = updated)
                                          1 -> params.copy(midtoneWheel = updated)
                                          else -> params.copy(highlightWheel = updated)
                                      }
                                  }
                              )
                              ParamSlider("Parlaklık (Y)", currentW.luminance, -1f..1f) { lumVal ->
                                  val updated = currentW.copy(luminance = lumVal)
                                  params = when (activeWheel) {
                                      0 -> params.copy(shadowWheel = updated)
                                      1 -> params.copy(midtoneWheel = updated)
                                      else -> params.copy(highlightWheel = updated)
                                  }
                              }
                          }
                          4 -> {
                              ParamSlider("Sis Kaldırma (Dehaze)", params.dehaze, -1f..1f) { params = params.copy(dehaze = it) }
                              ParamSlider("Netlik (Clarity)", params.clarity, -1f..1f) { params = params.copy(clarity = it) }
                              ParamSlider("Keskinlik (Sharpen)", params.sharpen, 0f..1f) { params = params.copy(sharpen = it) }
                              ParamSlider("Vinyet", params.vignette, -1f..1f) { params = params.copy(vignette = it) }
                              ParamSlider("Gren (Grain)", params.grain, 0f..1f) { params = params.copy(grain = it) }
                          }
                      }
                  }

                  val tabs = listOf("Işık", "Renk / HSL", "Eğriler", "Tekerler", "Efekt")
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Color(0xFF0A0B0D))
                          .horizontalScroll(rememberScrollState())
                          .padding(horizontal = 8.dp, vertical = 6.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      tabs.forEachIndexed { idx, label ->
                          val selected = activeTab == idx
                          Surface(
                              shape = RoundedCornerShape(20.dp),
                              color = if (selected) Color(0xFFE5A93C) else Color(0xFF1A1E26),
                              modifier = Modifier.clickable { activeTab = idx }
                          ) {
                              Text(
                                  text = label,
                                  color = if (selected) Color.Black else Color(0xFFD1D5DB),
                                  fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal,
                                  fontSize = 13.sp,
                                  modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp)
                              )
                          }
                      }
                  }
              }

              if (showUnsavedDialog) {
                  AlertDialog(
                      onDismissRequest = { showUnsavedDialog = false },
                      title = { Text("Kaydedilmemiş Değişiklikler") },
                      text = { Text("Yapılan renk ve ışık ayarları henüz kaydedilmedi. Kopya olarak kaydetmek ister misin?") },
                      confirmButton = {
                          TextButton(onClick = {
                              showUnsavedDialog = false
                              saveCopy()
                          }) {
                              Text("Kaydet")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = {
                              showUnsavedDialog = false
                              onClose(null)
                          }) {
                              Text("Değişiklikleri At")
                          }
                      }
                  )
              }
          }

          @Composable
          private fun ParamSlider(
              label: String,
              value: Float,
              range: ClosedFloatingPointRange<Float>,
              onValueChange: (Float) -> Unit
          ) {
              Column(modifier = Modifier.fillMaxWidth()) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Text(label, fontSize = 12.sp, color = Color(0xFFD1D5DB))
                      Text(
                          text = String.format(java.util.Locale.US, "%.2f", value),
                          fontSize = 12.sp,
                          color = Color(0xFFE5A93C)
                      )
                  }
                  Slider(
                      value = value.coerceIn(range.start, range.endInclusive),
                      onValueChange = onValueChange,
                      valueRange = range,
                      modifier = Modifier.height(28.dp)
                  )
              }
          }

          @Composable
          private fun ToneCurvePad(
              points: List<CurvePoint>,
              onPointsChange: (List<CurvePoint>) -> Unit
          ) {
              var draggedIdx by remember { mutableStateOf<Int?>(null) }

              Canvas(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(170.dp)
                      .clip(RoundedCornerShape(12.dp))
                      .background(Color(0xFF0C0E12))
                      .pointerInput(points) {
                          detectDragGestures(
                              onDragStart = { offset ->
                                  val w = size.width.toFloat().coerceAtLeast(1f)
                                  val h = size.height.toFloat().coerceAtLeast(1f)
                                  val nx = (offset.x / w).coerceIn(0f, 1f)
                                  val ny = (1f - offset.y / h).coerceIn(0f, 1f)
                                  val hitIndex = points.indexOfFirst { pt ->
                                      val px = pt.x * w
                                      val py = (1f - pt.y) * h
                                      hypot(px - offset.x, py - offset.y) < 42f
                                  }
                                  if (hitIndex >= 0) {
                                      draggedIdx = hitIndex
                                  } else {
                                      val next = (points + CurvePoint(nx, ny)).sortedBy { it.x }
                                      draggedIdx = next.indexOfFirst { it.x == nx && it.y == ny }.coerceAtLeast(0)
                                      onPointsChange(next)
                                  }
                              },
                              onDragEnd = { draggedIdx = null },
                              onDragCancel = { draggedIdx = null },
                              onDrag = { change, _ ->
                                  val idx = draggedIdx ?: return@detectDragGestures
                                  if (idx !in points.indices) return@detectDragGestures
                                  val w = size.width.toFloat().coerceAtLeast(1f)
                                  val h = size.height.toFloat().coerceAtLeast(1f)
                                  val nx = if (idx == 0) 0f else if (idx == points.lastIndex) 1f else (change.position.x / w).coerceIn(0.02f, 0.98f)
                                  val ny = (1f - change.position.y / h).coerceIn(0f, 1f)
                                  val mutable = points.toMutableList()
                                  mutable[idx] = CurvePoint(nx, ny)
                                  onPointsChange(mutable)
                              }
                          )
                      }
              ) {
                  val w = size.width
                  val h = size.height
                  drawLine(Color(0xFF282E3A), Offset(0f, h), Offset(w, 0f), strokeWidth = 1.5f)
                  for (i in 1..3) {
                      val g = i / 4f
                      drawLine(Color(0xFF1A1E26), Offset(w * g, 0f), Offset(w * g, h), strokeWidth = 1f)
                      drawLine(Color(0xFF1A1E26), Offset(0f, h * g), Offset(w, h * g), strokeWidth = 1f)
                  }
                  if (points.size >= 2) {
                      val path = Path().apply {
                          moveTo(points.first().x * w, (1f - points.first().y) * h)
                          for (i in 1 until points.size) {
                              lineTo(points[i].x * w, (1f - points[i].y) * h)
                          }
                      }
                      drawPath(path, color = Color(0xFFE5A93C), style = Stroke(width = 3f))
                  }
                  points.forEach { pt ->
                      drawCircle(
                          color = Color.White,
                          radius = 7f,
                          center = Offset(pt.x * w, (1f - pt.y) * h)
                      )
                  }
              }
          }

          @Composable
          private fun ColorWheelPad(
              wheel: ColorWheelOffset,
              onWheelChange: (ColorWheelOffset) -> Unit
          ) {
              Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                  Canvas(
                      modifier = Modifier
                          .size(140.dp)
                          .clip(CircleShape)
                          .background(Color(0xFF0C0E12))
                          .pointerInput(wheel) {
                              detectDragGestures { change, _ ->
                                  val r = size.width / 2f
                                  val dx = change.position.x - r
                                  val dy = change.position.y - r
                                  val dist = hypot(dx, dy).coerceAtMost(r)
                                  val strength = (dist / r).coerceIn(0f, 1f)
                                  val angleDeg = Math.toDegrees(atan2(dy.toDouble(), dx.toDouble())).toFloat()
                                  onWheelChange(wheel.copy(hueAngleDeg = angleDeg, strength = strength))
                              }
                          }
                  ) {
                      val radius = size.minDimension / 2f
                      val center = Offset(radius, radius)
                      drawCircle(Color(0xFF232834), radius = radius, center = center, style = Stroke(width = 2f))
                      drawCircle(Color(0xFF1A1E26), radius = radius * 0.5f, center = center, style = Stroke(width = 1f))

                      val rad = Math.toRadians(wheel.hueAngleDeg.toDouble())
                      val px = center.x + (cos(rad) * wheel.strength * radius).toFloat()
                      val py = center.y + (sin(rad) * wheel.strength * radius).toFloat()
                      drawLine(Color(0xFF6B7280), center, Offset(px, py), strokeWidth = 2f)
                      drawCircle(Color(0xFFE5A93C), radius = 9f, center = Offset(px, py))
                  }
              }
          }
          EOF

          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          exec gradle "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-pro-editor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
