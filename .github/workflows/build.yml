name: Build Minimalist Gallery & Pro Color Editor APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/14.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/11.0/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdk.dir=$SDK_ROOT" > local.properties
          fi

      - name: Scaffold Android Project
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          mkdir -p app/src/main/java/com/studio/galleryeditor
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GalleryProEditor"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.studio.galleryeditor"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.studio.galleryeditor"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.exifinterface:exifinterface:1.3.7")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          # Keep classes for release builds if enabled later
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Galeri &amp; Renk Stüdyosu</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_images" path="." />
              <external-files-path name="ext_images" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/studio/galleryeditor/EditModels.kt
          package com.studio.galleryeditor

          import android.net.Uri
          import kotlin.math.abs

          data class MediaItem(
              val id: Long,
              val uri: Uri,
              val displayName: String,
              val mimeType: String,
              val sizeBytes: Long,
              val width: Int,
              val height: Int,
              val dateAddedSec: Long,
              val isFavorite: Boolean = false
          )

          data class PhotoMetadata(
              val fileName: String,
              val mimeType: String,
              val dimensions: String,
              val fileSizeFormatted: String,
              val dateTaken: String,
              val cameraModel: String?,
              val lensModel: String?,
              val iso: String?,
              val shutterSpeed: String?,
              val aperture: String?,
              val focalLength: String?,
              val gpsSummary: String?
          )

          enum class CurveChannel(val label: String) {
              MASTER("RGB"),
              RED("Kırmızı"),
              GREEN("Yeşil"),
              BLUE("Mavi")
          }

          data class CurvePoint(val x: Float, val y: Float)

          data class ColorWheelOffset(
              val hueAngleDeg: Float = 0f,
              val strength: Float = 0f,
              val luminance: Float = 0f
          )

          data class HslBand(
              val name: String,
              val hue: Float = 0f,
              val saturation: Float = 0f,
              val luminance: Float = 0f
          )

          data class EditParams(
              val exposure: Float = 0f,
              val contrast: Float = 0f,
              val highlights: Float = 0f,
              val shadows: Float = 0f,
              val whites: Float = 0f,
              val blacks: Float = 0f,

              val temp: Float = 0f,
              val tint: Float = 0f,
              val vibrance: Float = 0f,
              val saturation: Float = 0f,

              val dehaze: Float = 0f,
              val clarity: Float = 0f,
              val vignette: Float = 0f,
              val grain: Float = 0f,
              val sharpen: Float = 0f,

              val masterCurve: List<CurvePoint> = listOf(CurvePoint(0f, 0f), CurvePoint(1f, 1f)),
              val redCurve: List<CurvePoint> = listOf(CurvePoint(0f, 0f), CurvePoint(1f, 1f)),
              val greenCurve: List<CurvePoint> = listOf(CurvePoint(0f, 0f), CurvePoint(1f, 1f)),
              val blueCurve: List<CurvePoint> = listOf(CurvePoint(0f, 0f), CurvePoint(1f, 1f)),

              val shadowWheel: ColorWheelOffset = ColorWheelOffset(),
              val midtoneWheel: ColorWheelOffset = ColorWheelOffset(),
              val highlightWheel: ColorWheelOffset = ColorWheelOffset(),

              val hslBands: List<HslBand> = listOf(
                  HslBand("Kırmızı"),
                  HslBand("Turuncu"),
                  HslBand("Sarı"),
                  HslBand("Yeşil"),
                  HslBand("Camgöbeği"),
                  HslBand("Mavi"),
                  HslBand("Mor"),
                  HslBand("Eflatun")
              )
          ) {
              fun isModified(): Boolean {
                  val d = EditParams()
                  return abs(exposure - d.exposure) > 0.001f ||
                      abs(contrast - d.contrast) > 0.001f ||
                      abs(highlights - d.highlights) > 0.001f ||
                      abs(shadows - d.shadows) > 0.001f ||
                      abs(whites - d.whites) > 0.001f ||
                      abs(blacks - d.blacks) > 0.001f ||
                      abs(temp - d.temp) > 0.001f ||
                      abs(tint - d.tint) > 0.001f ||
                      abs(vibrance - d.vibrance) > 0.001f ||
                      abs(saturation - d.saturation) > 0.001f ||
                      abs(dehaze - d.dehaze) > 0.001f ||
                      abs(clarity - d.clarity) > 0.001f ||
                      abs(vignette - d.vignette) > 0.001f ||
                      abs(grain - d.grain) > 0.001f ||
                      abs(sharpen - d.sharpen) > 0.001f ||
                      masterCurve != d.masterCurve ||
                      redCurve != d.redCurve ||
                      greenCurve != d.greenCurve ||
                      blueCurve != d.blueCurve ||
                      shadowWheel != d.shadowWheel ||
                      midtoneWheel != d.midtoneWheel ||
                      highlightWheel != d.highlightWheel ||
                      hslBands != d.hslBands
              }

              fun curveFor(channel: CurveChannel): List<CurvePoint> = when (channel) {
                  CurveChannel.MASTER -> masterCurve
                  CurveChannel.RED -> redCurve
                  CurveChannel.GREEN -> greenCurve
                  CurveChannel.BLUE -> blueCurve
              }

              fun withCurve(channel: CurveChannel, points: List<CurvePoint>): EditParams {
                  val sorted = points.sortedBy { it.x }.toMutableList()
                  if (sorted.first().x > 0f) sorted.add(0, CurvePoint(0f, sorted.first().y))
                  if (sorted.last().x < 1f) sorted.add(CurvePoint(1f, sorted.last().y))
                  val clean = sorted.map {
                      CurvePoint(it.x.coerceIn(0f, 1f), it.y.coerceIn(0f, 1f))
                  }
                  return when (channel) {
                      CurveChannel.MASTER -> copy(masterCurve = clean)
                      CurveChannel.RED -> copy(redCurve = clean)
                      CurveChannel.GREEN -> copy(greenCurve = clean)
                      CurveChannel.BLUE -> copy(blueCurve = clean)
                  }
              }

              fun buildLut256(): FloatArray {
                  val lut = FloatArray(256 * 4)
                  val m = sampleSpline256(masterCurve)
                  val r = sampleSpline256(redCurve)
                  val g = sampleSpline256(greenCurve)
                  val b = sampleSpline256(blueCurve)
                  for (i in 0 until 256) {
                      val ri = ((r[i] * 255f).toInt().coerceIn(0, 255))
                      val gi = ((g[i] * 255f).toInt().coerceIn(0, 255))
                      val bi = ((b[i] * 255f).toInt().coerceIn(0, 255))
                      lut[i * 4 + 0] = m[ri]
                      lut[i * 4 + 1] = m[gi]
                      lut[i * 4 + 2] = m[bi]
                      lut[i * 4 + 3] = 1f
                  }
                  return lut
              }

              private fun sampleSpline256(pts: List<CurvePoint>): FloatArray {
                  val out = FloatArray(256)
                  val p = pts.sortedBy { it.x }
                  if (p.size < 2) {
                      for (i in 0 until 256) out[i] = i / 255f
                      return out
                  }
                  for (i in 0 until 256) {
                      val x = i / 255f
                      var seg = 0
                      while (seg < p.size - 2 && x > p[seg + 1].x) {
                          seg++
                      }
                      val p0 = p[(seg - 1).coerceAtLeast(0)]
                      val p1 = p[seg]
                      val p2 = p[seg + 1]
                      val p3 = p[(seg + 2).coerceAtMost(p.size - 1)]
                      val span = (p2.x - p1.x).coerceAtLeast(0.0001f)
                      val t = ((x - p1.x) / span).coerceIn(0f, 1f)
                      val t2 = t * t
                      val t3 = t2 * t
                      val y = 0.5f * (
                          (2f * p1.y) +
                              (-p0.y + p2.y) * t +
                              (2f * p0.y - 5f * p1.y + 4f * p2.y - p3.y) * t2 +
                              (-p0.y + 3f * p1.y - 3f * p2.y + p3.y) * t3
                          )
                      out[i] = y.coerceIn(0f, 1f)
                  }
                  return out
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/studio/galleryeditor/MediaRepository.kt
          package com.studio.galleryeditor

          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import androidx.exifinterface.media.ExifInterface
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.roundToInt

          class MediaRepository(private val context: Context) {

              private val prefs = context.getSharedPreferences("gallery_pro_prefs", Context.MODE_PRIVATE)

              fun isGpsMetadataEnabled(): Boolean {
                  return prefs.getBoolean("show_gps_metadata", true)
              }

              fun setGpsMetadataEnabled(enabled: Boolean) {
                  prefs.edit().putBoolean("show_gps_metadata", enabled).apply()
              }

              fun isFavorite(uriString: String): Boolean {
                  val favs = prefs.getStringSet("favorites", emptySet()) ?: emptySet()
                  return favs.contains(uriString)
              }

              fun toggleFavorite(uriString: String): Boolean {
                  val current = (prefs.getStringSet("favorites", emptySet()) ?: emptySet()).toMutableSet()
                  val nowFav = if (current.contains(uriString)) {
                      current.remove(uriString)
                      false
                  } else {
                      current.add(uriString)
                      true
                  }
                  prefs.edit().putStringSet("favorites", current).apply()
                  return nowFav
              }

              suspend fun loadRecentImages(limit: Int = 500): List<MediaItem> = withContext(Dispatchers.IO) {
                  val items = mutableListOf<MediaItem>()
                  val collection = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL)
                  } else {
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  }

                  val projection = arrayOf(
                      MediaStore.Images.Media._ID,
                      MediaStore.Images.Media.DISPLAY_NAME,
                      MediaStore.Images.Media.MIME_TYPE,
                      MediaStore.Images.Media.SIZE,
                      MediaStore.Images.Media.WIDTH,
                      MediaStore.Images.Media.HEIGHT,
                      MediaStore.Images.Media.DATE_ADDED
                  )

                  val sortOrder = "${MediaStore.Images.Media.DATE_ADDED} DESC"

                  context.contentResolver.query(collection, projection, null, null, sortOrder)?.use { cursor ->
                      val idCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                      val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DISPLAY_NAME)
                      val mimeCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.MIME_TYPE)
                      val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE)
                      val wCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.WIDTH)
                      val hCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.HEIGHT)
                      val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED)

                      var count = 0
                      while (cursor.moveToNext() && count < limit) {
                          val id = cursor.getLong(idCol)
                          val uri = ContentUris.withAppendedId(collection, id)
                          val name = cursor.getString(nameCol) ?: "IMG_$id"
                          val mime = cursor.getString(mimeCol) ?: "image/jpeg"
                          val size = cursor.getLong(sizeCol)
                          val w = cursor.getInt(wCol)
                          val h = cursor.getInt(hCol)
                          val dateSec = cursor.getLong(dateCol)
                          items.add(
                              MediaItem(
                                  id = id,
                                  uri = uri,
                                  displayName = name,
                                  mimeType = mime,
                                  sizeBytes = size,
                                  width = w,
                                  height = h,
                                  dateAddedSec = dateSec,
                                  isFavorite = isFavorite(uri.toString())
                              )
                          )
                          count++
                      }
                  }
                  items
              }

              suspend fun readMetadata(item: MediaItem, includeGps: Boolean): PhotoMetadata = withContext(Dispatchers.IO) {
                  var iso: String? = null
                  var shutter: String? = null
                  var aperture: String? = null
                  var focal: String? = null
                  var cameraModel: String? = null
                  var lensModel: String? = null
                  var dateStr = formatEpoch(item.dateAddedSec * 1000L)
                  var gpsSummary: String? = null

                  try {
                      context.contentResolver.openInputStream(item.uri)?.use { stream ->
                          val exif = ExifInterface(stream)
                          iso = exif.getAttribute(ExifInterface.TAG_PHOTOGRAPHIC_SENSITIVITY)
                              ?: exif.getAttribute(ExifInterface.TAG_ISO_SPEED_RATINGS)
                          exif.getAttribute(ExifInterface.TAG_EXPOSURE_TIME)?.toDoubleOrNull()?.let { exp ->
                              shutter = if (exp >= 1.0) "${String.format(Locale.US, "%.1f", exp)}s"
                              else "1/${(1.0 / exp).roundToInt()}s"
                          }
                          exif.getAttribute(ExifInterface.TAG_F_NUMBER)?.toDoubleOrNull()?.let { f ->
                              aperture = "f/${String.format(Locale.US, "%.1f", f)}"
                          }
                          exif.getAttribute(ExifInterface.TAG_FOCAL_LENGTH)?.let { fl ->
                              val parts = fl.split("/")
                              if (parts.size == 2) {
                                  val num = parts[0].toDoubleOrNull()
                                  val den = parts[1].toDoubleOrNull()
                                  if (num != null && den != null && den != 0.0) {
                                      focal = "${String.format(Locale.US, "%.1f", num / den)} mm"
                                  }
                              }
                          }
                          cameraModel = listOfNotNull(
                              exif.getAttribute(ExifInterface.TAG_MAKE)?.trim(),
                              exif.getAttribute(ExifInterface.TAG_MODEL)?.trim()
                          ).distinct().joinToString(" ").ifBlank { null }
                          lensModel = exif.getAttribute(ExifInterface.TAG_LENS_MODEL)?.trim()?.ifBlank { null }
                          exif.getAttribute(ExifInterface.TAG_DATETIME_ORIGINAL)?.let {
                              dateStr = it
                          }
                          if (includeGps) {
                              val latLong = exif.latLong
                              if (latLong != null) {
                                  gpsSummary = "${String.format(Locale.US, "%.5f", latLong[0])}, ${String.format(Locale.US, "%.5f", latLong[1])}"
                              }
                          }
                      }
                  } catch (_: Exception) {
                  }

                  val mpText = if (item.width > 0 && item.height > 0) {
                      val mp = (item.width.toLong() * item.height.toLong()) / 1_000_000.0
                      "${item.width} x ${item.height} (${String.format(Locale.US, "%.1f", mp)} MP)"
                  } else {
                      "Bilinmiyor"
                  }

                  PhotoMetadata(
                      fileName = item.displayName,
                      mimeType = item.mimeType,
                      dimensions = mpText,
                      fileSizeFormatted = formatBytes(item.sizeBytes),
                      dateTaken = dateStr,
                      cameraModel = cameraModel,
                      lensModel = lensModel,
                      iso = iso?.let { "ISO $it" },
                      shutterSpeed = shutter,
                      aperture = aperture,
                      focalLength = focal,
                      gpsSummary = gpsSummary
                  )
              }

              suspend fun decodeBitmapForEdit(uri: Uri, maxDim: Int = 2048): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      context.contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it, null, bounds)
                      }
                      var sample = 1
                      while (bounds.outWidth / sample > maxDim || bounds.outHeight / sample > maxDim) {
                          sample *= 2
                      }
                      val opts = BitmapFactory.Options().apply {
                          inSampleSize = sample
                          inPreferredConfig = Bitmap.Config.ARGB_8888
                      }
                      context.contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it, null, opts)
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              suspend fun saveEditedJpgCopy(original: MediaItem, bitmap: Bitmap): Uri? = withContext(Dispatchers.IO) {
                  try {
                      val baseName = original.displayName.substringBeforeLast(".")
                      val outName = "${baseName}_edit_${System.currentTimeMillis()}.jpg"
                      val values = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, outName)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(MediaStore.Images.Media.RELATIVE_PATH, "${Environment.DIRECTORY_PICTURES}/GalleryProEdits")
                              put(MediaStore.Images.Media.IS_PENDING, 1)
                          }
                      }
                      val collection = MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                      val outUri = context.contentResolver.insert(collection, values) ?: return@withContext null

                      context.contentResolver.openOutputStream(outUri)?.use { out ->
                          bitmap.compress(Bitmap.CompressFormat.JPEG, 95, out)
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          values.clear()
                          values.put(MediaStore.Images.Media.IS_PENDING, 0)
                          context.contentResolver.update(outUri, values, null, null)
                      }
                      outUri
                  } catch (_: Exception) {
                      null
                  }
              }

              suspend fun deleteImage(item: MediaItem): Boolean = withContext(Dispatchers.IO) {
                  try {
                      context.contentResolver.delete(item.uri, null, null) > 0
                  } catch (_: Exception) {
                      false
                  }
              }

              fun prepareShareUri(uri: Uri): Uri? {
                  return try {
                      val tempFile = File(context.cacheDir, "share_${System.currentTimeMillis()}.jpg")
                      context.contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(tempFile).use { output -> input.copyTo(output) }
                      }
                      androidx.core.content.FileProvider.getUriForFile(
                          context,
                          "${context.packageName}.fileprovider",
                          tempFile
                      )
                  } catch (_: Exception) {
                      uri
                  }
              }

              private fun formatBytes(bytes: Long): String {
                  if (bytes <= 0) return "0 KB"
                  val kb = bytes / 1024.0
                  val mb = kb / 1024.0
                  return if (mb >= 1.0) "${String.format(Locale.US, "%.2f", mb)} MB"
                  else "${String.format(Locale.US, "%.0f", kb)} KB"
              }

              private fun formatEpoch(millis: Long): String {
                  return SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(Date(millis))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/studio/galleryeditor/GlPhotoEngine.kt
          package com.studio.galleryeditor

          import android.content.Context
          import android.graphics.Bitmap
          import android.opengl.EGL14
          import android.opengl.EGLConfig
          import android.opengl.EGLContext
          import android.opengl.EGLDisplay
          import android.opengl.EGLSurface
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.GLUtils
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGL10
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.cos
          import kotlin.math.sin

          object GlShaders {
              const val VERTEX_SHADER = """
                  attribute vec2 aPosition;
                  attribute vec2 aTexCoord;
                  varying vec2 vTexCoord;
                  void main() {
                      vTexCoord = aTexCoord;
                      gl_Position = vec4(aPosition, 0.0, 1.0);
                  }
              """

              const val FRAGMENT_SHADER = """
                  precision highp float;
                  varying vec2 vTexCoord;

                  uniform sampler2D uImage;
                  uniform sampler2D uLut;
                  uniform vec2 uTexel;

                  uniform float uExposure;
                  uniform float uContrast;
                  uniform float uHighlights;
                  uniform float uShadows;
                  uniform float uWhites;
                  uniform float uBlacks;

                  uniform float uTemp;
                  uniform float uTint;
                  uniform float uVibrance;
                  uniform float uSaturation;

                  uniform float uDehaze;
                  uniform float uClarity;
                  uniform float uVignette;
                  uniform float uGrain;
                  uniform float uSharpen;

                  uniform vec3 uShadowWheel;
                  uniform vec3 uMidtoneWheel;
                  uniform vec3 uHighlightWheel;

                  uniform vec3 uHsl[8];

                  float luma(vec3 c) {
                      return dot(c, vec3(0.2126, 0.7152, 0.0722));
                  }

                  vec3 rgb2hsv(vec3 c) {
                      vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
                      vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
                      vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
                      float d = q.x - min(q.w, q.y);
                      float e = 1.0e-10;
                      return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
                  }

                  vec3 hsv2rgb(vec3 c) {
                      vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                  }

                  float hash12(vec2 p) {
                      vec3 p3  = fract(vec3(p.xyx) * 0.1031);
                      p3 += dot(p3, p3.yzx + 33.33);
                      return fract((p3.x + p3.y) * p3.z);
                  }

                  float bandWeight(float h, float center) {
                      float diff = abs(h - center);
                      diff = min(diff, 1.0 - diff);
                      return smoothstep(0.14, 0.01, diff);
                  }

                  void main() {
                      vec3 col = texture2D(uImage, vTexCoord).rgb;

                      col.r += uTemp * 0.14 + uTint * 0.05;
                      col.g -= uTint * 0.10;
                      col.b -= uTemp * 0.14 - uTint * 0.05;
                      col = clamp(col, 0.0, 1.0);

                      col *= pow(2.0, uExposure);

                      float lum = luma(col);
                      float hiMask = smoothstep(0.45, 1.0, lum);
                      float shMask = 1.0 - smoothstep(0.0, 0.55, lum);
                      float whMask = smoothstep(0.75, 1.0, lum);
                      float blMask = 1.0 - smoothstep(0.0, 0.25, lum);

                      col += col * (uHighlights * 0.45 * hiMask);
                      col += (1.0 - col) * (uShadows * 0.45 * shMask);
                      col += uWhites * 0.35 * whMask;
                      col += uBlacks * 0.35 * blMask;
                      col = clamp(col, 0.0, 1.0);

                      vec3 blur1 = (
                          texture2D(uImage, vTexCoord + vec2(uTexel.x * 2.0, 0.0)).rgb +
                          texture2D(uImage, vTexCoord - vec2(uTexel.x * 2.0, 0.0)).rgb +
                          texture2D(uImage, vTexCoord + vec2(0.0, uTexel.y * 2.0)).rgb +
                          texture2D(uImage, vTexCoord - vec2(0.0, uTexel.y * 2.0)).rgb
                      ) * 0.25;

                      float detail = luma(col) - luma(blur1);
                      col += detail * (uClarity * 0.85 + uSharpen * 1.15);

                      if (abs(uDehaze) > 0.001) {
                          vec3 dehazed = (col - 0.12 * uDehaze) / max(0.25, 1.0 - 0.35 * uDehaze);
                          col = mix(col, clamp(dehazed, 0.0, 1.0), abs(uDehaze));
                      }
                      col = clamp(col, 0.0, 1.0);

                      col = ((col - 0.5) * (1.0 + uContrast * 0.85)) + 0.5;
                      col = clamp(col, 0.0, 1.0);

                      float lNow = luma(col);
                      float wShadow = 1.0 - smoothstep(0.0, 0.42, lNow);
                      float wHigh = smoothstep(0.58, 1.0, lNow);
                      float wMid = max(0.0, 1.0 - wShadow - wHigh);

                      col += uShadowWheel.xy * (0.35 * wShadow) + vec2(uShadowWheel.z * 0.25 * wShadow);
                      col += uMidtoneWheel.xy * (0.35 * wMid) + vec2(uMidtoneWheel.z * 0.25 * wMid);
                      col += uHighlightWheel.xy * (0.35 * wHigh) + vec2(uHighlightWheel.z * 0.25 * wHigh);
                      col = clamp(col, 0.0, 1.0);

                      vec3 hsv = rgb2hsv(col);
                      float centers[8];
                      centers[0] = 0.0;
                      centers[1] = 0.083;
                      centers[2] = 0.166;
                      centers[3] = 0.333;
                      centers[4] = 0.500;
                      centers[5] = 0.666;
                      centers[6] = 0.780;
                      centers[7] = 0.888;

                      for (int i = 0; i < 8; i++) {
                          float w = bandWeight(hsv.x, centers[i]);
                          if (w > 0.001) {
                              hsv.x = fract(hsv.x + uHsl[i].x * 0.12 * w);
                              hsv.y = clamp(hsv.y + uHsl[i].y * 0.65 * w, 0.0, 1.0);
                              hsv.z = clamp(hsv.z + uHsl[i].z * 0.55 * w, 0.0, 1.0);
                          }
                      }

                      float satBoost = uVibrance * 0.65 * (1.0 - hsv.y * 0.75) + uSaturation * 0.85;
                      hsv.y = clamp(hsv.y + satBoost, 0.0, 1.0);
                      col = hsv2rgb(hsv);

                      float rCurve = texture2D(uLut, vec2(clamp(col.r, 0.0, 1.0), 0.5)).r;
                      float gCurve = texture2D(uLut, vec2(clamp(col.g, 0.0, 1.0), 0.5)).g;
                      float bCurve = texture2D(uLut, vec2(clamp(col.b, 0.0, 1.0), 0.5)).b;
                      col = vec3(rCurve, gCurve, bCurve);

                      if (abs(uVignette) > 0.001) {
                          vec2 centered = (vTexCoord - 0.5) * 1.4142;
                          float dist = length(centered);
                          float vig = smoothstep(0.35, 1.15, dist);
                          col *= (1.0 - vig * uVignette * 0.65);
                      }

                      if (uGrain > 0.001) {
                          float n = (hash12(gl_FragCoord.xy) - 0.5) * 2.0;
                          col += n * uGrain * 0.14;
                      }

                      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
                  }
              """
          }

          private class ShaderProgram(vs: String, fs: String) {
              val program: Int

              init {
                  val vShader = compile(GLES20.GL_VERTEX_SHADER, vs)
                  val fShader = compile(GLES20.GL_FRAGMENT_SHADER, fs)
                  program = GLES20.glCreateProgram().also {
                      GLES20.glAttachShader(it, vShader)
                      GLES20.glAttachShader(it, fShader)
                      GLES20.glLinkProgram(it)
                  }
              }

              private fun compile(type: Int, src: String): Int {
                  return GLES20.glCreateShader(type).also {
                      GLES20.glShaderSource(it, src)
                      GLES20.glCompileShader(it)
                  }
              }

              fun applyUniforms(params: EditParams, showOriginal: Boolean, texWidth: Int, texHeight: Int) {
                  GLES20.glUseProgram(program)
                  val p = if (showOriginal) EditParams() else params

                  GLES20.glUniform2f(
                      GLES20.glGetUniformLocation(program, "uTexel"),
                      1f / texWidth.coerceAtLeast(1),
                      1f / texHeight.coerceAtLeast(1)
                  )
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uExposure"), p.exposure)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uContrast"), p.contrast)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uHighlights"), p.highlights)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uShadows"), p.shadows)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uWhites"), p.whites)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uBlacks"), p.blacks)

                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uTemp"), p.temp)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uTint"), p.tint)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uVibrance"), p.vibrance)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uSaturation"), p.saturation)

                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uDehaze"), p.dehaze)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uClarity"), p.clarity)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uVignette"), p.vignette)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uGrain"), p.grain)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uSharpen"), p.sharpen)

                  fun wheelVec(w: ColorWheelOffset): FloatArray {
                      val rad = Math.toRadians(w.hueAngleDeg.toDouble())
                      val x = (cos(rad) * w.strength).toFloat()
                      val y = (sin(rad) * w.strength).toFloat()
                      return floatArrayOf(x, y, w.luminance)
                  }

                  val sw = wheelVec(p.shadowWheel)
                  val mw = wheelVec(p.midtoneWheel)
                  val hw = wheelVec(p.highlightWheel)
                  GLES20.glUniform3f(GLES20.glGetUniformLocation(program, "uShadowWheel"), sw[0], sw[1], sw[2])
                  GLES20.glUniform3f(GLES20.glGetUniformLocation(program, "uMidtoneWheel"), mw[0], mw[1], mw[2])
                  GLES20.glUniform3f(GLES20.glGetUniformLocation(program, "uHighlightWheel"), hw[0], hw[1], hw[2])

                  val hslArray = FloatArray(8 * 3)
                  p.hslBands.take(8).forEachIndexed { idx, band ->
                      hslArray[idx * 3 + 0] = band.hue
                      hslArray[idx * 3 + 1] = band.saturation
                      hslArray[idx * 3 + 2] = band.luminance
                  }
                  GLES20.glUniform3fv(GLES20.glGetUniformLocation(program, "uHsl"), 8, hslArray, 0)
              }
          }

          class PhotoGlSurfaceView(context: Context) : GLSurfaceView(context) {
              private val renderer = PreviewRenderer()

              init {
                  setEGLContextClientVersion(2)
                  setRenderer(renderer)
                  renderMode = RENDERMODE_WHEN_DIRTY
              }

              fun setBitmap(bitmap: Bitmap?) {
                  renderer.pendingBitmap = bitmap
                  requestRender()
              }

              fun updateParams(params: EditParams, showOriginal: Boolean = false) {
                  renderer.params = params
                  renderer.showOriginal = showOriginal
                  requestRender()
              }

              private class PreviewRenderer : Renderer {
                  @Volatile var pendingBitmap: Bitmap? = null
                  @Volatile var params: EditParams = EditParams()
                  @Volatile var showOriginal: Boolean = false

                  private var shader: ShaderProgram? = null
                  private var imageTexId = 0
                  private var lutTexId = 0
                  private var imgW = 1
                  private var imgH = 1
                  private var surfaceW = 1
                  private var surfaceH = 1

                  private val quadCoords = ByteBuffer.allocateDirect(8 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer().apply {
                      put(floatArrayOf(-1f, -1f, 1f, -1f, -1f, 1f, 1f, 1f))
                      position(0)
                  }
                  private val texCoords = ByteBuffer.allocateDirect(8 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer().apply {
                      put(floatArrayOf(0f, 1f, 1f, 1f, 0f, 0f, 1f, 0f))
                      position(0)
                  }

                  override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                      GLES20.glClearColor(0.05f, 0.05f, 0.06f, 1f)
                      shader = ShaderProgram(GlShaders.VERTEX_SHADER, GlShaders.FRAGMENT_SHADER)
                      imageTexId = createTexture()
                      lutTexId = createTexture()
                  }

                  override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                      surfaceW = width.coerceAtLeast(1)
                      surfaceH = height.coerceAtLeast(1)
                      GLES20.glViewport(0, 0, surfaceW, surfaceH)
                  }

                  override fun onDrawFrame(gl: GL10?) {
                      GLES20.glClear(GLES20.glCOLOR_BUFFER_BIT)
                      val sp = shader ?: return

                      pendingBitmap?.let { bmp ->
                          if (!bmp.isRecycled) {
                              imgW = bmp.width
                              imgH = bmp.height
                              GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, imageTexId)
                              GLUtils.texImage2D(GLES20.GL_TEXTURE_2D, 0, bmp, 0)
                          }
                          pendingBitmap = null
                      }

                      val viewAspect = surfaceW.toFloat() / surfaceH.toFloat()
                      val imgAspect = imgW.toFloat() / imgH.toFloat().coerceAtLeast(0.01f)
                      var vpW = surfaceW
                      var vpH = surfaceH
                      if (imgAspect > viewAspect) {
                          vpH = (surfaceW / imgAspect).toInt().coerceAtLeast(1)
                      } else {
                          vpW = (surfaceH * imgAspect).toInt().coerceAtLeast(1)
                      }
                      val vpX = (surfaceW - vpW) / 2
                      val vpY = (surfaceH - vpH) / 2
                      GLES20.glViewport(vpX, vpY, vpW, vpH)

                      val lutFloats = (if (showOriginal) EditParams() else params).buildLut256()
                      val lutBuf = ByteBuffer.allocateDirect(256 * 4).order(ByteOrder.nativeOrder())
                      for (i in 0 until 256) {
                          lutBuf.put(((lutFloats[i * 4 + 0] * 255f).toInt().coerceIn(0, 255)).toByte())
                          lutBuf.put(((lutFloats[i * 4 + 1] * 255f).toInt().coerceIn(0, 255)).toByte())
                          lutBuf.put(((lutFloats[i * 4 + 2] * 255f).toInt().coerceIn(0, 255)).toByte())
                          lutBuf.put(255.toByte())
                      }
                      lutBuf.position(0)
                      GLES20.glActiveTexture(GLES20.GL_TEXTURE1)
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, lutTexId)
                      GLES20.glTexImage2D(GLES20.GL_TEXTURE_2D, 0, GLES20.GL_RGBA, 256, 1, 0, GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, lutBuf)

                      GLES20.glActiveTexture(GLES20.GL_TEXTURE0)
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, imageTexId)

                      sp.applyUniforms(params, showOriginal, imgW, imgH)
                      GLES20.glUniform1i(GLES20.glGetUniformLocation(sp.program, "uImage"), 0)
                      GLES20.glUniform1i(GLES20.glGetUniformLocation(sp.program, "uLut"), 1)

                      val posLoc = GLES20.glGetAttribLocation(sp.program, "aPosition")
                      val texLoc = GLES20.glGetAttribLocation(sp.program, "aTexCoord")
                      GLES20.glEnableVertexAttribArray(posLoc)
                      GLES20.glEnableVertexAttribArray(texLoc)
                      GLES20.glVertexAttribPointer(posLoc, 2, GLES20.GL_FLOAT, false, 0, quadCoords)
                      GLES20.glVertexAttribPointer(texLoc, 2, GLES20.GL_FLOAT, false, 0, texCoords)

                      GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)

                      GLES20.glDisableVertexAttribArray(posLoc)
                      GLES20.glDisableVertexAttribArray(texLoc)
                  }

                  private fun createTexture(): Int {
                      val ids = IntArray(1)
                      GLES20.glGenTextures(1, ids, 0)
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, ids[0])
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
                      return ids[0]
                  }
              }
          }

          fun renderBitmapOffscreen(source: Bitmap, params: EditParams): Bitmap {
              val w = source.width
              val h = source.height
              val eglDisplay: EGLDisplay = EGL14.eglGetDisplay(EGL14.EGL_DEFAULT_DISPLAY)
              EGL14.eglInitialize(eglDisplay, IntArray(2), 0, IntArray(2), 0)
              val configs = arrayOfNulls<EGLConfig>(1)
              val numConfigs = IntArray(1)
              val cfgAttrs = intArrayOf(
                  EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT,
                  EGL14.EGL_RED_SIZE, 8, EGL14.EGL_GREEN_SIZE, 8, EGL14.EGL_BLUE_SIZE, 8,
                  EGL14.EGL_NONE
              )
              EGL14.eglChooseConfig(eglDisplay, cfgAttrs, 0, configs, 0, 1, numConfigs, 0)
              val ctxAttrs = intArrayOf(EGL14.EGL_CONTEXT_CLIENT_VERSION, 2, EGL14.EGL_NONE)
              val eglCtx: EGLContext = EGL14.eglCreateContext(eglDisplay, configs[0], EGL14.EGL_NO_CONTEXT, ctxAttrs, 0)
              val surfAttrs = intArrayOf(EGL14.EGL_WIDTH, w, EGL14.EGL_HEIGHT, h, EGL14.EGL_NONE)
              val eglSurf: EGLSurface = EGL14.eglCreatePbufferSurface(eglDisplay, configs[0], surfAttrs, 0)
              EGL14.eglMakeCurrent(eglDisplay, eglSurf, eglSurf, eglCtx)

              val fbo = IntArray(1)
              GLES20.glGenFramebuffers(1, fbo, 0)
              GLES20.glBindFramebuffer(GLES20.GL_FRAMEBUFFER, fbo[0])

              val outTex = IntArray(1)
              GLES20.glGenTextures(1, outTex, 0)
              GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, outTex[0])
              GLES20.glTexImage2D(GLES20.GL_TEXTURE_2D, 0, GLES20.GL_RGBA, w, h, 0, GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, null)
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)
              GLES20.glFramebufferTexture2D(GLES20.GL_FRAMEBUFFER, GLES20.GL_COLOR_ATTACHMENT0, GLES20.GL_TEXTURE_2D, outTex[0], 0)

              val sp = ShaderProgram(GlShaders.VERTEX_SHADER, GlShaders.FRAGMENT_SHADER)
              val imgTex = IntArray(1)
              GLES20.glGenTextures(1, imgTex, 0)
              GLES20.glActiveTexture(GLES20.GL_TEXTURE0)
              GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, imgTex[0])
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
              GLUtils.texImage2D(GLES20.GL_TEXTURE_2D, 0, source, 0)

              val lutFloats = params.buildLut256()
              val lutBuf = ByteBuffer.allocateDirect(256 * 4).order(ByteOrder.nativeOrder())
              for (i in 0 until 256) {
                  lutBuf.put(((lutFloats[i * 4 + 0] * 255f).toInt().coerceIn(0, 255)).toByte())
                  lutBuf.put(((lutFloats[i * 4 + 1] * 255f).toInt().coerceIn(0, 255)).toByte())
                  lutBuf.put(((lutFloats[i * 4 + 2] * 255f).toInt().coerceIn(0, 255)).toByte())
                  lutBuf.put(255.toByte())
              }
              lutBuf.position(0)
              val lutTex = IntArray(1)
              GLES20.glGenTextures(1, lutTex, 0)
              GLES20.glActiveTexture(GLES20.GL_TEXTURE1)
              GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, lutTex[0])
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
              GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)
              GLES20.glTexImage2D(GLES20.GL_TEXTURE_2D, 0, GLES20.GL_RGBA, 256, 1, 0, GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, lutBuf)

              GLES20.glViewport(0, 0, w, h)
              sp.applyUniforms(params, false, w, h)
              GLES20.glUniform1i(GLES20.glGetUniformLocation(sp.program, "uImage"), 0)
              GLES20.glUniform1i(GLES20.glGetUniformLocation(sp.program, "uLut"), 1)

              val quad = ByteBuffer.allocateDirect(8 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer().apply {
                  put(floatArrayOf(-1f, -1f, 1f, -1f, -1f, 1f, 1f, 1f))
                  position(0)
              }
              val tex = ByteBuffer.allocateDirect(8 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer().apply {
                  put(floatArrayOf(0f, 1f, 1f, 1f, 0f, 0f, 1f, 0f))
                  position(0)
              }
              val posLoc = GLES20.glGetAttribLocation(sp.program, "aPosition")
              val texLoc = GLES20.glGetAttribLocation(sp.program, "aTexCoord")
              GLES20.glEnableVertexAttribArray(posLoc)
              GLES20.glEnableVertexAttribArray(texLoc)
              GLES20.glVertexAttribPointer(posLoc, 2, GLES20.GL_FLOAT, false, 0, quad)
              GLES20.glVertexAttribPointer(texLoc, 2, GLES20.GL_FLOAT, false, 0, tex)
              GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)

              val pixelBuf = ByteBuffer.allocateDirect(w * h * 4).order(ByteOrder.nativeOrder())
              GLES20.glReadPixels(0, 0, w, h, GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, pixelBuf)
              pixelBuf.position(0)

              val result = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              result.copyPixelsFromBuffer(pixelBuf)

              GLES20.glBindFramebuffer(GLES20.GL_FRAMEBUFFER, 0)
              GLES20.glDeleteTextures(3, intArrayOf(outTex[0], imgTex[0], lutTex[0]), 0)
              GLES20.glDeleteFramebuffers(1, fbo, 0)
              EGL14.eglMakeCurrent(eglDisplay, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_CONTEXT)
              EGL14.eglDestroySurface(eglDisplay, eglSurf)
              EGL14.eglDestroyContext(eglDisplay, eglCtx)
              EGL14.eglTerminate(eglDisplay)

              return result
          }
